{{- $dest := .Destination | replaceRE `^\s+|\s+$` "" -}}
{{- if and (strings.HasPrefix $dest "/") (not (strings.HasPrefix $dest "//")) -}}
  {{- $dest = $dest | strings.TrimPrefix "/" | relURL -}}
{{- end -}}
<a href="{{ $dest }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>

        - Type: A
          TTL: 15
  WorkspaceEgressProxyExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service: ecs-tasks.amazonaws.com
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      Policies:
      - PolicyName: PullProxyImageAndWriteLogs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchCheckLayerAvailability
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tina-staging/runtime
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::GetAtt:
              - WorkspaceEgressProxyLogs
              - Arn
  WorkspaceEgressProxyTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: Dedicated zero-IAM HTTPS CONNECT allowlist proxy for ephemeral agent sandboxes.
        must: Keep ReadonlyRootFilesystem true and zero TaskRoleArn.
    Properties:
      Family: tina-staging-egress-proxy
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn:
        Fn::GetAtt:
        - WorkspaceEgressProxyExecutionRole
        - Arn
      ContainerDefinitions:
      - Name: egress-proxy
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/runtime@${ImageDigest}
          - ImageDigest:
              Ref: RuntimeDigest
        Essential: true
        User: 1000:1000
        ReadonlyRootFilesystem: true
        EntryPoint:
        - python
        - -m
        - runtime_kernel.egress_proxy
        PortMappings:
        - ContainerPort: 3128
          Protocol: tcp
        Environment:
        - Name: TINA_EGRESS_PROXY_PORT
          Value: '3128'
        - Ref: AWS::NoValue
        HealthCheck:
          Command:
          - CMD
          - python
          - -c
          - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3128/health', timeout=2).close()
          Interval: 15
          Timeout: 5
          Retries: 3
          StartPeriod: 15
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: WorkspaceEgressProxyLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: proxy
  WorkspaceEgressProxyService:
    Type: AWS::ECS::Service
    DependsOn:
    - WorkspaceEcrApiVpcEndpoint
    - WorkspaceEcrDkrVpcEndpoint
    - WorkspaceLogsVpcEndpoint
    - EgressAppEgressA
    - EgressAppEgressB
    - FoundationS3GatewayEndpoint
    Properties:
      Cluster:
        Ref: FoundationCluster
      TaskDefinition:
        Ref: WorkspaceEgressProxyTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
          - Ref: FoundationAppA
          - Ref: FoundationAppB
          SecurityGroups:
          - Fn::GetAtt:
            - WorkspaceEgressProxySecurityGroup
            - GroupId
      ServiceRegistries:
      - RegistryArn:
          Fn::GetAtt:
          - WorkspaceEgressProxyDiscovery
          - Arn
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

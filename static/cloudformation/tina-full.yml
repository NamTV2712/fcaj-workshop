            Resource:
              Ref: DataValkeyAuth
  RuntimeRuntimeTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Ref: AWS::StackName
      NetworkMode: awsvpc
      RequiresCompatibilities:
      - FARGATE
      Cpu: '256'
      Memory: '512'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn:
        Fn::GetAtt:
        - RuntimeRuntimeExecutionRole
        - Arn
      TaskRoleArn:
        Fn::GetAtt:
        - BotRuntimeTaskRole
        - Arn
      ContainerDefinitions:
      - Name: runtime
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/runtime@${ImageDigest}
          - ImageDigest:
              Ref: RuntimeDigest
        Essential: true
        PortMappings:
        - ContainerPort: 8090
          Protocol: tcp
        Environment:
        - Name: AWS_REGION
          Value:
            Ref: AWS::Region
        - Name: RUNTIME_BACKEND
          Value: ecs
        - Name: RUNTIME_ECS_WORKSPACE_STORAGE
          Value: s3
        - Name: RUNTIME_ECS_WORKSPACE_IMAGE
          Value:
            Fn::Sub:
            - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/agent-worker@${ImageDigest}
            - ImageDigest:
                Ref: AgentWorkerDigest
        - Name: RUNTIME_ECS_WORKSPACE_TASKS
          Value: '{}'
        - Fn::If:
          - RuntimeWithNovaWorkspace
          - Name: RUNTIME_ECS_NOVA_WORKSPACE_TASK_DEFINITION
            Value:
              Ref: WorkspaceNovaWorkspaceTaskDefinition
          - Ref: AWS::NoValue
        - Fn::If:
          - RuntimeWithNovaWorkspace
          - Name: RUNTIME_ECS_NOVA_WORKSPACE_OWNERS
            Value:
              Ref: WorkspaceOwnerIds
          - Ref: AWS::NoValue
        - Name: RUNTIME_ECS_EPHEMERAL_TASK_DEFINITION
          Value:
            Ref: WorkspaceEphemeralWorkspaceTaskDefinition
        - Name: RUNTIME_ECS_EPHEMERAL_SECURITY_GROUP
          Value:
            Fn::GetAtt:
            - WorkspaceEphemeralWorkspaceSecurityGroup
            - GroupId
        - Name: RUNTIME_ECS_WORKSPACE_S3_BROKER_ROLE_ARN
          Value:
            Fn::GetAtt:
            - WorkspaceWorkspaceS3BrokerRole
            - Arn
        - Name: RUNTIME_ECS_WORKSPACE_S3_BUCKET
          Value:
            Ref: WorkspaceWorkspaceStoreBucket
        - Name: RUNTIME_ECS_WORKSPACE_S3_KMS_KEY_ARN
          Value:
            Fn::GetAtt:
            - WorkspaceWorkspaceDataKey
            - Arn
        - Ref: AWS::NoValue
        - Ref: AWS::NoValue
        - Ref: AWS::NoValue
        - Ref: AWS::NoValue
        - Ref: AWS::NoValue
        - Ref: AWS::NoValue
        - Ref: AWS::NoValue
        - Name: RUNTIME_ECS_CLUSTER
          Value:
            Ref: FoundationCluster
        - Name: RUNTIME_ECS_BOT_TASK_DEFINITION
          Value:
            Ref: BotBotTaskDefinition
        - Name: RUNTIME_ECS_SUBNETS
          Value:
            Fn::Join:
            - ','
            - - Ref: FoundationAppA
              - Ref: FoundationAppB
        - Name: RUNTIME_ECS_SECURITY_GROUPS
          Value:
            Fn::GetAtt:
            - DataAppSecurityGroup
            - GroupId
        - Name: RUNTIME_ECS_INVOCATION_BUCKET
          Value:
            Ref: FoundationStagingRecordings
        - Name: RUNTIME_ECS_DRAFT_TASK_DEFINITION
          Value:
            Ref: RuntimeDraftTaskDefinition
        - Name: RUNTIME_ECS_DRAFT_SECURITY_GROUP
          Value:
            Fn::GetAtt:
            - RuntimeDraftNetwork
            - GroupId
        - Name: AGENT_WORKER_IMAGE
          Value:
            Fn::Sub:
            - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/agent-api@${ImageDigest}
            - ImageDigest:
                Ref: AgentApiDigest
        - Name: BROWSER_IMAGE
          Value:
            Fn::Sub:
            - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/bot@${ImageDigest}
            - ImageDigest:
                Ref: BotDigest
        - Name: VALKEY_HOST
          Value:
            Fn::GetAtt:
            - DataValkey
            - PrimaryEndPoint.Address
        - Name: RUNTIME_OWNER_QUOTA
          Value:
            Fn::Sub:
            - ${OwnerQuota}
            - OwnerQuota: '3'
        - Name: RUNTIME_GLOBAL_QUOTA
          Value:
            Fn::Sub:
            - ${GlobalQuota}
            - GlobalQuota: '20'
        - Name: RUNTIME_REAPER_TICK_SEC
          Value:
            Fn::Sub:
            - ${ReaperTickSec}
            - ReaperTickSec: '30'
        - Name: RUNTIME_WORKSPACE_IDLE_TIMEOUT_SEC
          Value:
            Fn::Sub:
            - ${WorkspaceIdleTimeoutSec}
            - WorkspaceIdleTimeoutSec: '300'
        - Name: RUNTIME_WORKSPACE_MAX_LIFETIME_SEC
          Value:
            Fn::Sub:
            - ${WorkspaceMaxLifetimeSec}
            - WorkspaceMaxLifetimeSec: '3600'
        Secrets:
        - Name: VALKEY_PASSWORD
          ValueFrom:
            Ref: DataValkeyAuth
        Command:
        - python
        - -c
        - 'import os

          import sys

          from urllib.parse import quote


          password = quote(os.environ.pop("VALKEY_PASSWORD"), safe="")

          host = os.environ.pop("VALKEY_HOST")

          os.environ["REDIS_URL"] = f"rediss://:{password}@{host}:6379/0?ssl_check_hostname=True&ssl_cert_reqs=required"

          os.execv(sys.executable, [sys.executable, "-m", "runtime_kernel"])

          '
        HealthCheck:
          Command:
          - CMD
          - python
          - -c
          - import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3).close()
          Interval: 15
          Timeout: 5
          Retries: 3
          StartPeriod: 30
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-region:
              Ref: AWS::Region
            awslogs-group:
              Ref: RuntimeRuntimeLogs
            awslogs-stream-prefix: ecs
  RuntimeRuntimeService:
    Type: AWS::ECS::Service
    Properties:
      Cluster:
        Ref: FoundationCluster
      TaskDefinition:
        Ref: RuntimeRuntimeTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
          - Ref: FoundationAppA
          - Ref: FoundationAppB
          SecurityGroups:
          - Fn::GetAtt:
            - DataAppSecurityGroup
            - GroupId
          - Fn::GetAtt:
            - RuntimeRuntimeIngress
            - GroupId
      ServiceRegistries:
      - RegistryArn:
          Fn::GetAtt:
          - RuntimeDiscoveryService
          - Arn
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
    DependsOn:
    - EgressAppEgressA
    - EgressAppEgressB
    - FoundationS3GatewayEndpoint
  WorkspaceWorkspaceDataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: KMS CMK for TINA staging S3 workspace snapshots and manifests
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
        - Sid: AccountRootAdmin
          Effect: Allow
          Principal:
            AWS:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
          Action: kms:*
          Resource: '*'
  WorkspaceWorkspaceDataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/tina-staging-workspace-data
      TargetKeyId:
        Ref: WorkspaceWorkspaceDataKey
  WorkspaceWorkspaceSecretsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: KMS CMK strictly for per-user reusable GitHub tokens (agent-api only)
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
        - Sid: AccountRootAdmin
          Effect: Allow
          Principal:
            AWS:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
          Action: kms:*
          Resource: '*'
  WorkspaceWorkspaceSecretsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/tina-staging-workspace-secrets
      TargetKeyId:
        Ref: WorkspaceWorkspaceSecretsKey
  WorkspaceWorkspaceStoreBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: tina-staging-workspaces-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: true
          ServerSideEncryptionByDefault:
            SSEAlgorithm: aws:kms
            KMSMasterKeyID:
              Fn::GetAtt:
              - WorkspaceWorkspaceDataKey
              - Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
        - Id: ExpireOldVersionsAndOrphanUploads
          Status: Enabled
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1
          NoncurrentVersionExpiration:
            NoncurrentDays: '30'
          ExpiredObjectDeleteMarker: true
  WorkspaceWorkspaceStoreBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: WorkspaceWorkspaceStoreBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: RequireTLS
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::GetAtt:
            - WorkspaceWorkspaceStoreBucket
            - Arn
          - Fn::Sub: ${WorkspaceWorkspaceStoreBucket.Arn}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
  WorkspaceWorkspaceS3BrokerRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Assumed by Runtime with an inline STS Session Policy scoped strictly to one turn's granted prefixes.
        must: Never permit access to secrets/* or object deletion.
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            AWS:
              Fn::GetAtt:
              - BotRuntimeTaskRole
              - Arn
          Action: sts:AssumeRole
      Policies:
      - PolicyName: ScopedWorkspaceS3Access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: s3:ListBucket
            Resource:
              Fn::GetAtt:
              - WorkspaceWorkspaceStoreBucket
              - Arn
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            Resource:
            - Fn::Sub: ${WorkspaceWorkspaceStoreBucket.Arn}/users/*
            - Fn::Sub: ${WorkspaceWorkspaceStoreBucket.Arn}/shared/*
            - Fn::Sub: ${WorkspaceWorkspaceStoreBucket.Arn}/_global/*
          - Effect: Allow
            Action:
            - kms:Decrypt
            - kms:GenerateDataKey
            Resource:
              Fn::GetAtt:
              - WorkspaceWorkspaceDataKey
              - Arn
          - Effect: Deny
            Action: s3:*
            Resource:
              Fn::Sub: ${WorkspaceWorkspaceStoreBucket.Arn}/secrets/*
          - Effect: Deny
            Action:
            - s3:DeleteObject
            - s3:DeleteObjectVersion
            - s3:PutBucketPolicy
            Resource: '*'
  WorkspaceAgentApiWorkspaceS3Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AgentApiWorkspaceS3Access
      Roles:
      - Fn::Select:
        - 1
        - Fn::Split:
          - /
          - Fn::GetAtt:
            - AgentVoiceModelRole
            - Arn
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: s3:ListBucket
          Resource:
            Fn::GetAtt:
            - WorkspaceWorkspaceStoreBucket
            - Arn
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:PutObject

      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-data-b
  FoundationPublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: FoundationVpc
  FoundationPublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: FoundationVpcGateway
    Properties:
      RouteTableId:
        Ref: FoundationPublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: FoundationInternetGateway
  FoundationAppRoutesA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: FoundationVpc
  FoundationAppRoutesB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: FoundationVpc
  FoundationDataRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: FoundationVpc
  FoundationPublicAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:

      RouteTableId:
        Ref: FoundationDataRoutes
  FoundationDataAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: FoundationDataB
      RouteTableId:
        Ref: FoundationDataRoutes
  FoundationS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Ref: FoundationVpc
      VpcEndpointType: Gateway
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.s3
      RouteTableIds:
      - Ref: FoundationAppRoutesA
      - Ref: FoundationAppRoutesB
  FoundationCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName:
        Fn::Sub: ${AWS::StackName}-ecs
      CapacityProviders:
      - FARGATE
      DefaultCapacityProviderStrategy:
      - CapacityProvider: FARGATE
        Weight: 1
  FoundationStagingRecordings:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
        - Id: ExpireBotInvocations
          Prefix: runtime-invocations/
          Status: Enabled
          ExpirationInDays: 1
  FoundationStagingRecordingsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FoundationStagingRecordings
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::GetAtt:
            - FoundationStagingRecordings
            - Arn
          - Fn::Sub: ${FoundationStagingRecordings.Arn}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
  EgressNatAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  EgressNat:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId:
        Ref: FoundationPublicA
      AllocationId:
        Fn::GetAtt:
        - EgressNatAddress
        - AllocationId
    DependsOn:
    - FoundationVpcGateway
  EgressAppEgressA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: FoundationAppRoutesA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:
        Ref: EgressNat
  EgressAppEgressB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: FoundationAppRoutesB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:
        Ref: EgressNat
  DataAppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TINA staging application tasks
      VpcId:
        Ref: FoundationVpc
  DataPostgresSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from TINA staging application tasks
      VpcId:
        Ref: FoundationVpc
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        SourceSecurityGroupId:
          Ref: DataAppSecurityGroup
  DataValkeySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Valkey from TINA staging application tasks
      VpcId:
        Ref: FoundationVpc
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 6379
        ToPort: 6379
        SourceSecurityGroupId:
          Ref: DataAppSecurityGroup
  DataPostgresSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: TINA staging private data subnets
      SubnetIds:
      - Ref: FoundationDataA
      - Ref: FoundationDataB
  DataPostgres:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '17'
      DBInstanceClass: db.t4g.micro
      DBName: tina
      MasterUsername: tinaadmin
      ManageMasterUserPassword: true
      DBSubnetGroupName:
        Ref: DataPostgresSubnets
      VPCSecurityGroups:
      - Ref: DataPostgresSecurityGroup
      StorageType: gp3
      AllocatedStorage: '20'
      StorageEncrypted: true
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      MultiAZ: false
  DataValkeySubnets:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: TINA staging private data subnets
      SubnetIds:
      - Ref: FoundationDataA
      - Ref: FoundationDataB
  DataValkeyAuth:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  DataValkey:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: TINA staging Valkey
      Engine: valkey
      EngineVersion: '8.0'
      CacheNodeType: cache.t4g.micro
      ClusterMode: disabled
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false
      MultiAZEnabled: false
      CacheSubnetGroupName:
        Ref: DataValkeySubnets
      SecurityGroupIds:
      - Ref: DataValkeySecurityGroup
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      TransitEncryptionMode: required
      AuthToken:
        Fn::Sub: '{{resolve:secretsmanager:${DataValkeyAuth}:SecretString}}'
  EdgeOriginSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TINA internal ALB accepts only CloudFront origin traffic
      VpcId:
        Ref: FoundationVpc
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        SourcePrefixListId:
          Ref: CloudFrontOriginPrefixListId
  EdgeLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: application
      Subnets:
      - Ref: FoundationAppA
      - Ref: FoundationAppB
      SecurityGroups:
      - Ref: EdgeOriginSecurityGroup
  EdgeListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: EdgeLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
      - Type: fixed-response
        FixedResponseConfig:
          StatusCode: '503'
          ContentType: text/plain
          MessageBody: TINA staging application is not deployed yet.
  EdgeEdgeHealth:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: EdgeListener
      Priority: 10
      Conditions:
      - Field: path-pattern
        Values:
        - /edge-health
      Actions:
      - Type: fixed-response
        FixedResponseConfig:
          StatusCode: '200'
          ContentType: text/plain
          MessageBody: TINA_EDGE_READY
  EdgeOrigin:
    Type: AWS::CloudFront::VpcOrigin
    DependsOn:
    - EdgeListener
    - FoundationVpcGateway
    Properties:
      VpcOriginEndpointConfig:
        Arn:
          Ref: EdgeLoadBalancer
        Name:
          Ref: AWS::StackName
        HTTPPort: 80
        OriginProtocolPolicy: http-only
  EdgeDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: TINA staging edge
        Enabled: true
        HttpVersion: http2
        WebACLId:
          Fn::GetAtt:
          - WebAcl
          - Arn
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
        - Id: tina-internal-alb
          DomainName:
            Fn::GetAtt:
            - EdgeLoadBalancer
            - DNSName
          VpcOriginConfig:
            VpcOriginId:
              Fn::GetAtt:
              - EdgeOrigin
              - Id
        DefaultCacheBehavior:
          TargetOriginId: tina-internal-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          - PUT
          - PATCH
          - POST
          - DELETE
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        CustomErrorResponses:
        - ErrorCode: 503
          ErrorCachingMinTTL: 0
  BotBotLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  BotBotExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: LoadBotAndInvocation
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchGetImage
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tina-staging/bot
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::GetAtt:
              - BotBotLogs
              - Arn
          - Effect: Allow
            Action: s3:GetBucketLocation
            Resource:
              Fn::Sub:
              - arn:${AWS::Partition}:s3:::${InvocationBucket}
              - InvocationBucket:
                  Ref: FoundationStagingRecordings
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub:
              - arn:${AWS::Partition}:s3:::${InvocationBucket}/runtime-invocations/*
              - InvocationBucket:
                  Ref: FoundationStagingRecordings
  BotBotTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Ref: AWS::StackName
      NetworkMode: awsvpc
      RequiresCompatibilities:
      - FARGATE
      Cpu: '4096'
      Memory: '8192'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn:
        Fn::GetAtt:
        - BotBotExecutionRole
        - Arn
      ContainerDefinitions:
      - Name: bot
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/bot@${ImageDigest}
          - ImageDigest:
              Ref: BotDigest
        Essential: true
        StopTimeout: 30
        EntryPoint:
          Ref: AWS::NoValue
        Command:
          Ref: AWS::NoValue
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-region:
              Ref: AWS::Region
            awslogs-group:
              Ref: BotBotLogs
            awslogs-stream-prefix: ecs
  BotRuntimeTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      Policies:
      - PolicyName: ManagePinnedBotTasks
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ecs:DescribeTaskDefinition
            Resource: '*'
          - Effect: Allow
            Action: ecs:RunTask
            Resource:
              Ref: BotBotTaskDefinition
            Condition:
              ArnEquals:
                ecs:cluster:
                  Fn::Sub:
                  - arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
                  - ClusterName:
                      Ref: FoundationCluster
          - Effect: Allow
            Action: ecs:ListTasks
            Resource: '*'
            Condition:
              ArnEquals:
                ecs:cluster:
                  Fn::Sub:
                  - arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
                  - ClusterName:
                      Ref: FoundationCluster
          - Effect: Allow
            Action:
            - ecs:DescribeTasks
            - ecs:ListTagsForResource
            Resource:
              Fn::Sub:
              - arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ClusterName}/*
              - ClusterName:
                  Ref: FoundationCluster
          - Effect: Allow
            Action: ecs:StopTask
            Resource:
              Fn::Sub:
              - arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ClusterName}/*
              - ClusterName:
                  Ref: FoundationCluster
            Condition:
              'Null':
                aws:ResourceTag/tina:runtime-workload: 'false'
          - Effect: Allow
            Action: ecs:TagResource
            Resource:
              Fn::Sub:
              - arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${ClusterName}/*
              - ClusterName:
                  Ref: FoundationCluster
            Condition:
              StringEquals:
                ecs:CreateAction: RunTask
          - Effect: Allow
            Action: iam:PassRole
            Resource:
              Fn::GetAtt:
              - BotBotExecutionRole
              - Arn
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            Resource:
              Fn::Sub:
              - arn:${AWS::Partition}:s3:::${InvocationBucket}/runtime-invocations/*
              - InvocationBucket:
                  Ref: FoundationStagingRecordings

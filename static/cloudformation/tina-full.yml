  WorkspaceEgressProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Ref: FoundationVpc
      GroupDescription: Strict HTTPS CONNECT allowlist proxy for ephemeral workspaces
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 10.42.0.0/16
      - IpProtocol: tcp
        FromPort: 53
        ToPort: 53
        CidrIp: 10.42.0.0/16
  WorkspaceEphemeralWorkspaceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Ref: FoundationVpc
      GroupDescription: Ephemeral S3 workspace worker egress (Valkey + HTTPS/S3 Gateway, no EFS)
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 6379
        ToPort: 6379
        DestinationSecurityGroupId:
          Fn::GetAtt:
          - DataValkeySecurityGroup
          - GroupId
      - IpProtocol: udp
        FromPort: 53
        ToPort: 53
        CidrIp: 10.42.0.0/16
      - IpProtocol: tcp
        FromPort: 53
        ToPort: 53
        CidrIp: 10.42.0.0/16
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        DestinationPrefixListId:
          Ref: S3PrefixListId
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        DestinationSecurityGroupId:
          Fn::GetAtt:
          - WorkspaceVpcEndpointsSecurityGroup
          - GroupId
      - IpProtocol: tcp
        FromPort: 3128
        ToPort: 3128
        DestinationSecurityGroupId:
          Fn::GetAtt:
          - WorkspaceEgressProxySecurityGroup
          - GroupId
  WorkspaceEgressProxyIngressFromWorkers:
    Type: AWS::EC2::SecurityGroupIngress

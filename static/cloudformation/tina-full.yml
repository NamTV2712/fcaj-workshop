          - ImageDigest:
              Ref: McpDigest
        Essential: true
        User: 65532:65532
        Environment:
        - Name: PYTHONDONTWRITEBYTECODE
          Value: '1'
        - Name: TINA_ENV
          Value: production
        - Name: GATEWAY_URL
          Value: http://core.tina-staging.local:8000
        - Name: TINA_MCP_READ_ONLY
          Value: '1'
        - Name: TINA_MCP_TRANSPORT_HOST
          Value: mcp.tina-staging.local:8010
        - Name: TINA_MCP_PUBLIC_ORIGIN
          Value:
            Fn::Sub: https://${EdgeDistribution.DomainName}
        ReadonlyRootFilesystem: true
        PortMappings:
        - ContainerPort: 8010
        HealthCheck:
          Command:
          - CMD
          - python
          - -c
          - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=4).close()
          Interval: 15
          Timeout: 5
          Retries: 4
          StartPeriod: 30
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: McpLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: ecs
  McpMcp:
    Type: AWS::ECS::Service
    Properties:
      Cluster:
        Ref: FoundationCluster
      TaskDefinition:
        Ref: McpTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
          - Ref: FoundationAppA
          - Ref: FoundationAppB
          SecurityGroups:
          - Fn::GetAtt:
            - McpIngress
            - GroupId
          - Fn::GetAtt:
            - CoreCoreClients
            - GroupId
      ServiceRegistries:
      - RegistryArn:
          Fn::GetAtt:
          - McpDiscovery
          - Arn
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 0
        MaximumPercent: 100
    DependsOn:
    - EgressAppEgressA
    - EgressAppEgressB
    - FoundationS3GatewayEndpoint
  FlowsDatabasePassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true
  FlowsFlowsApiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  FlowsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  FlowsIngress:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private Flows API from TINA staging core clients
      VpcId:
        Ref: FoundationVpc
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 8200
        ToPort: 8200
        SourceSecurityGroupId:
          Fn::GetAtt:
          - CoreCoreClients
          - GroupId
  FlowsDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: flows
      DnsConfig:
        NamespaceId:
          Ref: RuntimeDiscoveryNamespace
        DnsRecords:
        - Type: A
          TTL: 15
  FlowsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      Policies:
      - PolicyName: LoadFlowsImageAndCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchGetImage
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tina-staging/flows
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::GetAtt:
              - FlowsLogs
              - Arn
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
            - Fn::GetAtt:
              - DataPostgres
              - MasterUserSecret.SecretArn
            - Ref: FlowsDatabasePassword
            - Ref: FlowsFlowsApiKey
            - Ref: CoreAdminToken
            - Ref: CoreInternalSecret
  FlowsTask:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: Run API and queue worker from the same image with their own Postgres database.
        must: Both services wait for database provisioning. Only the provisioning container receives the RDS master
          credential. Mailbox is a separate opt-in service.
    Properties:
      Family:
        Ref: AWS::StackName
      NetworkMode: awsvpc
      RequiresCompatibilities:
      - FARGATE
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn:
        Fn::GetAtt:
        - FlowsExecutionRole
        - Arn
      ContainerDefinitions:
      - Name: db-init
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/flows@${ImageDigest}
          - ImageDigest:
              Ref: FlowsDigest
        Essential: false
        Environment:
        - Name: FLOWS_DB_HOST
          Value:
            Fn::GetAtt:
            - DataPostgres
            - Endpoint.Address
        Secrets:
        - Name: RDS_MASTER
          ValueFrom:
            Fn::GetAtt:
            - DataPostgres
            - MasterUserSecret.SecretArn
        - Name: FLOWS_DB_PASSWORD
          ValueFrom:
            Ref: FlowsDatabasePassword
        Command:
        - python
        - -c
        - "import json\nimport os\nfrom pathlib import Path\nimport psycopg\nfrom psycopg import sql\n\nhost = os.environ[\"\
          FLOWS_DB_HOST\"]\nmaster = json.loads(os.environ.pop(\"RDS_MASTER\"))\npassword = os.environ.pop(\"FLOWS_DB_PASSWORD\"\
          )\nwith psycopg.connect(host=host, dbname=\"postgres\", user=master[\"username\"],\n                 \
          \    password=master[\"password\"], sslmode=\"require\", autocommit=True) as conn:\n    conn.execute(\"\
          SELECT pg_advisory_lock(23117516)\")\n    if not conn.execute(\"SELECT 1 FROM pg_roles WHERE rolname =\
          \ 'tina_flows'\").fetchone():\n        conn.execute(\"CREATE ROLE tina_flows LOGIN\")\n    conn.execute(sql.SQL(\"\
          ALTER ROLE tina_flows PASSWORD {}\").format(sql.Literal(password)))\n    if not conn.execute(\"SELECT\
          \ 1 FROM pg_database WHERE datname = 'tina_flows'\").fetchone():\n        conn.execute(\"CREATE DATABASE\
          \ tina_flows\")\n    conn.execute(\"REVOKE CONNECT ON DATABASE tina_flows FROM PUBLIC\")\n    conn.execute(\"\
          GRANT CONNECT ON DATABASE tina_flows TO tina_flows\")\nwith psycopg.connect(host=host, dbname=\"tina_flows\"\
          , user=master[\"username\"],\n                     password=master[\"password\"], sslmode=\"require\"\
          ) as conn:\n    conn.execute(\"GRANT USAGE, CREATE ON SCHEMA public TO tina_flows\")\nwith psycopg.connect(host=host,\
          \ dbname=\"tina_flows\", user=\"tina_flows\",\n                     password=password, sslmode=\"require\"\
          ) as conn:\n    conn.execute(Path(\"/app/schema.sql\").read_text())\n"
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: FlowsLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: ecs
      - Name: api
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/flows@${ImageDigest}
          - ImageDigest:
              Ref: FlowsDigest
        Essential: true
        DependsOn:
        - ContainerName: db-init
          Condition: SUCCESS
        PortMappings:
        - ContainerPort: 8200
        Environment:
        - Name: FLOWS_DB_HOST
          Value:
            Fn::GetAtt:
            - DataPostgres
            - Endpoint.Address
        - Name: TINA_FLOWS_API_HOST
          Value: 0.0.0.0
        - Name: TINA_FLOWS_API_PORT
          Value: '8200'
        - Name: TINA_FLOWS_ADMIN_API_URL
          Value: http://core.tina-staging.local:8001
        - Name: TINA_FLOWS_GATEWAY_URL
          Value: http://core.tina-staging.local:8000
        Secrets:
        - Name: FLOWS_DB_PASSWORD
          ValueFrom:
            Ref: FlowsDatabasePassword
        - Name: TINA_FLOWS_API_KEY
          ValueFrom:
            Ref: FlowsFlowsApiKey
        - Name: TINA_FLOWS_ADMIN_KEY
          ValueFrom:
            Ref: CoreAdminToken
        - Name: TINA_INTERNAL_API_SECRET
          ValueFrom:
            Ref: CoreInternalSecret
        Command:
        - python
        - -c
        - 'import os

          from urllib.parse import quote

          password = quote(os.environ.pop("FLOWS_DB_PASSWORD"), safe="")

          host = os.environ["FLOWS_DB_HOST"]

          os.environ["TINA_FLOWS_DB_URL"] = f"postgresql+psycopg://tina_flows:{password}@{host}/tina_flows?sslmode=require"

          os.execvp("python", ["python", "-m", "flows_integrations.flows_api"])

          '
        HealthCheck:
          Command:
          - CMD
          - python
          - -c
          - import urllib.request; urllib.request.urlopen('http://localhost:8200/health', timeout=3).close()
          Interval: 15
          Timeout: 5
          Retries: 4
          StartPeriod: 20
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: FlowsLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: ecs
      - Name: worker
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/flows@${ImageDigest}
          - ImageDigest:
              Ref: FlowsDigest
        Essential: true
        DependsOn:
        - ContainerName: api
          Condition: HEALTHY
        Environment:
        - Name: FLOWS_DB_HOST
          Value:
            Fn::GetAtt:
            - DataPostgres
            - Endpoint.Address
        - Name: TINA_FLOWS_ADMIN_API_URL
          Value: http://core.tina-staging.local:8001
        - Name: TINA_FLOWS_GATEWAY_URL
          Value: http://core.tina-staging.local:8000
        Secrets:
        - Name: FLOWS_DB_PASSWORD
          ValueFrom:
            Ref: FlowsDatabasePassword
        - Name: TINA_FLOWS_API_KEY
          ValueFrom:
            Ref: FlowsFlowsApiKey
        - Name: TINA_FLOWS_ADMIN_KEY
          ValueFrom:
            Ref: CoreAdminToken
        - Name: TINA_INTERNAL_API_SECRET
          ValueFrom:
            Ref: CoreInternalSecret
        Command:
        - python
        - -c
        - 'import os

          from urllib.parse import quote

          password = quote(os.environ.pop("FLOWS_DB_PASSWORD"), safe="")

          host = os.environ["FLOWS_DB_HOST"]

          os.environ["TINA_FLOWS_DB_URL"] = f"postgresql+psycopg://tina_flows:{password}@{host}/tina_flows?sslmode=require"

          os.execvp("python", ["python", "-m", "flows_worker"])

          '
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: FlowsLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: ecs
  FlowsService:
    Type: AWS::ECS::Service
    Properties:
      Cluster:
        Ref: FoundationCluster
      TaskDefinition:
        Ref: FlowsTask
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
          - Ref: FoundationAppA
          - Ref: FoundationAppB
          SecurityGroups:
          - Fn::GetAtt:
            - DataAppSecurityGroup
            - GroupId
          - Fn::GetAtt:
            - CoreCoreClients
            - GroupId
          - Fn::GetAtt:
            - FlowsIngress
            - GroupId
      ServiceRegistries:
      - RegistryArn:
          Fn::GetAtt:
          - FlowsDiscovery
          - Arn
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
    DependsOn:
    - EgressAppEgressA
    - EgressAppEgressB
    - FoundationS3GatewayEndpoint
  TerminalNextAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  TerminalTerminalLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  TerminalTerminalIngress:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Terminal HTTP from the internal staging ALB
      VpcId:
        Ref: FoundationVpc
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 3000
        ToPort: 3000
        SourceSecurityGroupId:
          Fn::GetAtt:
          - EdgeOriginSecurityGroup
          - GroupId
  TerminalTerminalTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Ref: FoundationVpc
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/auth/providers
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
  TerminalTerminalRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: EdgeListener
      Priority: 100
      Conditions:
      - Field: path-pattern
        Values:
        - /*
      Actions:
      - Type: forward
        TargetGroupArn:
          Ref: TerminalTerminalTargets
  TerminalExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      Policies:
      - PolicyName: PullTerminalAndInjectSecrets
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchGetImage
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tina-staging/terminal
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::GetAtt:
              - TerminalTerminalLogs
              - Arn
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
            - Ref: CoreAdminToken
            - Ref: CoreInternalSecret
            - Ref: TerminalNextAuthSecret
            - Ref: AWS::NoValue
  TerminalTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: Expose the full workbench only to server-verified pilot identities.
        must: Keep meetings as the default and match the image's build-time mode to the rollout parameter.
    Properties:
      Family:
        Ref: AWS::StackName
      NetworkMode: awsvpc
      RequiresCompatibilities:
      - FARGATE
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn:
        Fn::GetAtt:
        - TerminalExecutionRole
        - Arn
      ContainerDefinitions:
      - Name: terminal
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/terminal@${ImageDigest}
          - ImageDigest:
              Ref: TerminalDigest
        Essential: true
        PortMappings:
        - ContainerPort: 3000
        Environment:
        - Name: NODE_ENV
          Value: production
        - Name: HOSTNAME
          Value: 0.0.0.0
        - Name: PORT
          Value: '3000'
        - Name: NEXT_PUBLIC_TERMINAL_MODE
          Value:
            Fn::If:
            - TerminalWithWorkspacePilot
            - workspace-pilot
            - meetings
        - Name: TINA_WORKSPACE_PILOT_STAGE
          Value: routines
        - Name: TINA_WORKSPACE_PILOT_USER_IDS
          Value:
            Ref: WorkspaceOwnerIds
        - Name: GATEWAY_URL
          Value: http://core.tina-staging.local:8000
        - Name: TINA_API_URL
          Value: http://core.tina-staging.local:8000
        - Name: TINA_ADMIN_API_URL
          Value: http://core.tina-staging.local:8001
        - Name: TINA_ASR_CONTROL_URL
          Value: ''
        - Name: NEXTAUTH_URL
          Value:
            Fn::Sub: https://${EdgeDistribution.DomainName}
        - Name: TERMINAL_URL
          Value:
            Fn::Sub: https://${EdgeDistribution.DomainName}
        Secrets:
        - Name: TINA_ADMIN_API_KEY
          ValueFrom:
            Ref: CoreAdminToken
        - Name: TINA_INTERNAL_API_SECRET
          ValueFrom:
            Ref: CoreInternalSecret
        - Name: NEXTAUTH_SECRET
          ValueFrom:
            Ref: TerminalNextAuthSecret
        - Ref: AWS::NoValue
        - Ref: AWS::NoValue
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: TerminalTerminalLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: ecs
  TerminalTerminalService:
    Type: AWS::ECS::Service
    DependsOn:
    - TerminalTerminalRule
    - EgressAppEgressA
    - EgressAppEgressB
    - FoundationS3GatewayEndpoint
    Properties:
      Cluster:
        Ref: FoundationCluster
      TaskDefinition:
        Ref: TerminalTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
          - Ref: FoundationAppA
          - Ref: FoundationAppB
          SecurityGroups:
          - Fn::GetAtt:
            - CoreCoreClients
            - GroupId
          - Fn::GetAtt:
            - TerminalTerminalIngress
            - GroupId
      LoadBalancers:
      - ContainerName: terminal
        ContainerPort: 3000
        TargetGroupArn:
          Ref: TerminalTerminalTargets
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Metadata:
      com.aws.cloudformation.Context:
        why: Filter common requests at the CloudFront edge.
        must: Keep CloudFront scope and review rules before production.
    Properties:
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: TinaWorkshopAcl
      Rules:
      - Name: AWSManagedRulesCommonRuleSet
        Priority: 0
        OverrideAction:
          None: {}
        Statement:
          ManagedRuleGroupStatement:
            VendorName: AWS
            Name: AWSManagedRulesCommonRuleSet
        VisibilityConfig:
          SampledRequestsEnabled: true
          CloudWatchMetricsEnabled: true
          MetricName: TinaCommonRules
Outputs:
  WebsiteUrl:
    Description: CloudFront URL for this TINA instance.
    Value:
      Fn::Sub: https://${EdgeDistribution.DomainName}
  EcsCluster:
    Description: ECS cluster for this instance.
    Value:
      Ref: FoundationCluster
  RecordingsBucket:
    Description: Retained recordings bucket.
    Value:
      Ref: FoundationStagingRecordings
  WorkspaceBucket:
    Description: Retained and versioned workspace bucket.
    Value:
      Ref: WorkspaceWorkspaceStoreBucket
  PublicMcpUrl:
    Description: Authenticated read-only MCP endpoint.
    Value:
      Fn::Sub:
      - ${Origin}/mcp
      - Origin:
          Fn::Sub: https://${EdgeDistribution.DomainName}

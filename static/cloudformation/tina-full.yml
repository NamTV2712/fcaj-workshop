        Ref: FoundationPublicA
      RouteTableId:
        Ref: FoundationPublicRoutes
  FoundationPublicAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: FoundationPublicB
      RouteTableId:
        Ref: FoundationPublicRoutes
  FoundationAppAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:

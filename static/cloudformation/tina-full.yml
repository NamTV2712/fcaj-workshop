      GroupId:
        Fn::GetAtt:
        - WorkspaceEgressProxySecurityGroup
        - GroupId
      SourceSecurityGroupId:
        Fn::GetAtt:
        - WorkspaceEphemeralWorkspaceSecurityGroup
        - GroupId
      IpProtocol: tcp
      FromPort: 3128
      ToPort: 3128
  WorkspaceEgressProxyDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: egress-proxy

            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchGetImage
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tina-staging/runtime
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::GetAtt:
              - RuntimeRuntimeLogs
              - Arn
          - Effect: Allow

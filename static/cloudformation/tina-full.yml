        NamespaceId:
          Ref: RuntimeDiscoveryNamespace
        DnsRecords:
        - Type: A
          TTL: 15
  RuntimeRuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: PullRuntimeAndReadValkeySecret
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow

          - Effect: Allow
            Action: s3:GetObject
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:s3:::${InvocationBucket}/runtime-invocations/workspace/*
              - InvocationBucket:
                  Ref: FoundationStagingRecordings
            - Fn::Sub:
              - arn:${AWS::Partition}:s3:::${InvocationBucket}/runtime-invocations/workspace-sync/*
              - InvocationBucket:
                  Ref: FoundationStagingRecordings
  WorkspaceEphemeralWorkspaceTaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Bedrock-only task role for ephemeral workers. ZERO S3 permissions so untrusted Bash cannot access S3.
        must: Never grant s3:* or secretsmanager:* to this role.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service: ecs-tasks.amazonaws.com
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      Policies:
      - PolicyName: EphemeralWorkerBedrockOnly
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*
            - Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-*
            - Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-*
  WorkspaceEphemeralWorkspaceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Single static Fargate task definition serving unlimited users and shared wikis via local ephemeral
          SSD + scoped sync sidecar.
        must: Keep STS credentials confined to sync sidecar environmentFiles; never expose them to worker.
    Properties:
      Family: tina-staging-ws-ephemeral
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn:
        Fn::GetAtt:
        - WorkspaceEphemeralWorkspaceExecutionRole
        - Arn
      TaskRoleArn:
        Fn::GetAtt:
        - WorkspaceEphemeralWorkspaceTaskRole
        - Arn
      Volumes:
      - Name: workspaces
      - Name: sync-tmp
      - Name: worker-tmp
      ContainerDefinitions:
      - Name: init-perms
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/agent-worker@${ImageDigest}
          - ImageDigest:
              Ref: AgentWorkerDigest
        Essential: false
        EntryPoint:
        - sh
        - -c
        Command:
        - chown 1000:1000 /workspaces /sync-tmp /worker-tmp && chmod 0755 /workspaces && chmod 1777 /sync-tmp /worker-tmp
        MountPoints:
        - SourceVolume: workspaces
          ContainerPath: /workspaces
          ReadOnly: false
        - SourceVolume: sync-tmp
          ContainerPath: /sync-tmp
          ReadOnly: false
        - SourceVolume: worker-tmp
          ContainerPath: /worker-tmp
          ReadOnly: false
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: WorkspaceEphemeralWorkspaceLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: init
      - Name: stream
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/agent-worker@${ImageDigest}
          - ImageDigest:
              Ref: AgentWorkerDigest
        Essential: true
        User: 1000:1000
        ReadonlyRootFilesystem: true
        EntryPoint:
        - python
        - -m
        - worker.workspace_stream
        Environment:
        - Name: VALKEY_HOST
          Value:
            Fn::GetAtt:
            - DataValkey
            - PrimaryEndPoint.Address
        Secrets:
        - Name: VALKEY_PASSWORD
          ValueFrom:
            Ref: DataValkeyAuth
        HealthCheck:
          Command:
          - CMD
          - python
          - -c
          - import socket; socket.create_connection(('127.0.0.1',8721),2).close()
          Interval: 5
          Timeout: 3
          Retries: 5
          StartPeriod: 5
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: WorkspaceEphemeralWorkspaceLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: stream
      - Name: sync
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/agent-worker@${ImageDigest}
          - ImageDigest:
              Ref: AgentWorkerDigest
        Essential: true
        User: 1000:1000
        ReadonlyRootFilesystem: true
        EntryPoint:
        - python
        - -m
        - worker.workspace_sync
        DependsOn:
        - ContainerName: init-perms
          Condition: SUCCESS
        Environment:
        - Name: TMPDIR
          Value: /tmp
        MountPoints:
        - SourceVolume: workspaces
          ContainerPath: /workspaces
          ReadOnly: false
        - SourceVolume: sync-tmp
          ContainerPath: /tmp
          ReadOnly: false
        HealthCheck:
          Command:
          - CMD
          - python
          - -c
          - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8722/health', timeout=2).close()
          Interval: 5
          Timeout: 3
          Retries: 10
          StartPeriod: 10
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: WorkspaceEphemeralWorkspaceLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: sync
      - Name: worker
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/agent-worker@${ImageDigest}
          - ImageDigest:
              Ref: AgentWorkerDigest
        Essential: true
        User: 1000:1000
        ReadonlyRootFilesystem: true
        LinuxParameters:
          InitProcessEnabled: true
        DependsOn:
        - ContainerName: stream
          Condition: HEALTHY
        - ContainerName: sync
          Condition: HEALTHY
        Environment:
        - Name: TMPDIR
          Value: /tmp
        - Name: XDG_CACHE_HOME
          Value: /tmp/.cache
        - Name: XDG_CONFIG_HOME
          Value: /tmp/.config
        - Name: XDG_DATA_HOME
          Value: /tmp/.local/share
        - Name: npm_config_cache
          Value: /tmp/.npm
        - Name: UV_CACHE_DIR
          Value: /tmp/.uv
        - Name: HTTPS_PROXY
          Value: http://egress-proxy.tina-staging.local:3128
        - Name: https_proxy
          Value: http://egress-proxy.tina-staging.local:3128
        - Name: HTTP_PROXY
          Value: http://egress-proxy.tina-staging.local:3128
        - Name: http_proxy
          Value: http://egress-proxy.tina-staging.local:3128
        - Name: NO_PROXY
          Value: 127.0.0.1,localhost,.tina-staging.local,.s3.us-east-1.amazonaws.com,169.254.170.2,169.254.169.254
        - Name: no_proxy
          Value: 127.0.0.1,localhost,.tina-staging.local,.s3.us-east-1.amazonaws.com,169.254.170.2,169.254.169.254
        MountPoints:
        - SourceVolume: workspaces
          ContainerPath: /workspaces
          ReadOnly: false
        - SourceVolume: worker-tmp
          ContainerPath: /tmp
          ReadOnly: false
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: WorkspaceEphemeralWorkspaceLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: worker

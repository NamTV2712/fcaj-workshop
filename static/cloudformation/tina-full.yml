          - GroupId
  CoreDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: core
      DnsConfig:
        NamespaceId:
          Ref: RuntimeDiscoveryNamespace
        DnsRecords:
        - Type: A
          TTL: 15
  CoreExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      Policies:
      - PolicyName: PullCoreAndInjectSecrets
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchGetImage
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tina-staging/admin-api
            - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tina-staging/meeting-api
            - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tina-staging/gateway
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::GetAtt:
              - CoreCoreLogs
              - Arn
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
            - Ref: CoreCoreDbPassword
            - Ref: CoreAdminToken
            - Ref: CoreInternalSecret
            - Fn::GetAtt:
              - DataPostgres
              - MasterUserSecret.SecretArn
            - Ref: DataValkeyAuth
            - Ref: VieGemToken
            - Fn::If:
              - CoreWithVoice
              - Ref: VoiceTtsToken
              - Ref: AWS::NoValue
            - Fn::If:
              - CoreWithVoice
              - Ref: VoiceTtsProfileKey
              - Ref: AWS::NoValue
  CoreTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      Policies:
      - PolicyName: ManageStagingRecordings
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: s3:ListBucket
            Resource:
              Fn::Sub:
              - arn:${AWS::Partition}:s3:::${RecordingsBucket}
              - RecordingsBucket:
                  Ref: FoundationStagingRecordings
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:AbortMultipartUpload
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:s3:::${RecordingsBucket}/recordings/*
              - RecordingsBucket:
                  Ref: FoundationStagingRecordings
            - Fn::Sub:
              - arn:${AWS::Partition}:s3:::${RecordingsBucket}/signal/*
              - RecordingsBucket:
                  Ref: FoundationStagingRecordings
  CoreTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Ref: AWS::StackName
      NetworkMode: awsvpc
      RequiresCompatibilities:
      - FARGATE
      Cpu: '2048'
      Memory: '4096'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn:
        Fn::GetAtt:
        - CoreExecutionRole
        - Arn
      TaskRoleArn:
        Fn::GetAtt:
        - CoreTaskRole
        - Arn
      ContainerDefinitions:
      - Name: schema-init
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/admin-api@${ImageDigest}
          - ImageDigest:
              Ref: AdminDigest
        Essential: false
        Environment:
        - Name: DB_HOST
          Value:
            Fn::GetAtt:
            - DataPostgres
            - Endpoint.Address
        Secrets:
        - Name: MASTER_PASSWORD
          ValueFrom:
            Fn::Sub:
            - '${PostgresSecretArn}:password::'
            - PostgresSecretArn:
                Fn::GetAtt:
                - DataPostgres
                - MasterUserSecret.SecretArn
        - Name: DB_PASSWORD
          ValueFrom:
            Ref: CoreCoreDbPassword
        Command:
        - python
        - -c
        - "import asyncio\nimport os\nimport re\nimport ssl\nimport urllib.request\n\nimport asyncpg\n\nasync def\
          \ main():\n    with urllib.request.urlopen(\"https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem\"\
          , timeout=15) as r:\n        tls = ssl.create_default_context(cadata=r.read().decode())\n    db = await\
          \ asyncpg.connect(host=os.environ[\"DB_HOST\"], database=\"tina\", user=\"tinaadmin\",\n             \
          \                  password=os.environ[\"MASTER_PASSWORD\"], ssl=tls, timeout=12)\n    try:\n        password\
          \ = os.environ[\"DB_PASSWORD\"]\n        if not re.fullmatch(r\"[a-zA-Z0-9]{40}\", password):\n      \
          \      raise ValueError(\"Unexpected staging database credential format\")\n        async with db.transaction():\n\
          \            await db.execute(\"SELECT pg_advisory_xact_lock(528385)\")\n            if not await db.fetchval(\"\
          SELECT 1 FROM pg_roles WHERE rolname='tina_core'\"):\n                await db.execute(\"CREATE ROLE tina_core\
          \ LOGIN\")\n            literal = await db.fetchval(\"SELECT quote_literal($1::text)\", password)\n  \
          \          await db.execute(\"ALTER ROLE tina_core PASSWORD \" + literal)\n            await db.execute(\"\
          GRANT CONNECT ON DATABASE tina TO tina_core\")\n            await db.execute(\"GRANT USAGE, CREATE ON\
          \ SCHEMA public TO tina_core\")\n        print(\"TINA_STAGING_DB_ROLE_READY\", flush=True)\n    finally:\n\
          \        await db.close()\n\nasyncio.run(main())\n"
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: CoreCoreLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: ecs
      - Name: admin
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/admin-api@${ImageDigest}
          - ImageDigest:
              Ref: AdminDigest
        Essential: true
        DependsOn:
        - ContainerName: schema-init
          Condition: SUCCESS
        PortMappings:
        - ContainerPort: 8001
        Environment:
        - Name: DB_HOST
          Value:
            Fn::GetAtt:
            - DataPostgres
            - Endpoint.Address
        Secrets:
        - Name: DB_PASSWORD
          ValueFrom:
            Ref: CoreCoreDbPassword
        - Name: ADMIN_API_TOKEN
          ValueFrom:
            Ref: CoreAdminToken
        - Name: INTERNAL_API_SECRET
          ValueFrom:
            Ref: CoreInternalSecret
        Command:
        - python
        - -c
        - "import os\nimport sys\nimport urllib.request\nfrom urllib.parse import quote\nfrom pathlib import Path\n\
          \nca_path = Path(\"/tmp/rds-ca.pem\")\nwith urllib.request.urlopen(\"https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem\"\
          , timeout=15) as response:\n    ca_path.write_bytes(response.read())\nos.environ[\"PGSSLROOTCERT\"] =\
          \ str(ca_path)\npassword = quote(os.environ.pop(\"DB_PASSWORD\"), safe=\"\")\nhost = os.environ.pop(\"\
          DB_HOST\")\nos.environ[\"DATABASE_URL\"] = f\"postgresql+asyncpg://tina_core:{password}@{host}:5432/tina?ssl=verify-full\"\
          \nos.execv(sys.executable, [sys.executable, \"-m\", \"admin_api\"])\n"
        HealthCheck:
          Command:
          - CMD
          - python
          - -c
          - import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4).close()
          Interval: 15
          Timeout: 5
          Retries: 3
          StartPeriod: 30
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Ref: CoreCoreLogs
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: ecs
      - Name: meeting
        Image:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/tina-staging/meeting-api@${ImageDigest}
          - ImageDigest:
              Ref: MeetingDigest
        Essential: true
        DependsOn:
        - ContainerName: admin
          Condition: HEALTHY
        PortMappings:
        - ContainerPort: 8080
        Environment:
        - Name: DB_HOST
          Value:
            Fn::GetAtt:
            - DataPostgres
            - Endpoint.Address
        - Name: VALKEY_HOST
          Value:
            Fn::GetAtt:
            - DataValkey
            - PrimaryEndPoint.Address
        - Name: ADMIN_API_URL
          Value: http://127.0.0.1:8001
        - Name: RUNTIME_API_URL

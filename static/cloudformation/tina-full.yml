        Ref: FoundationVpc
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      CidrBlock: 10.42.20.0/24
      Tags:
      - Key: Name
        Value:
          Fn::Sub: ${AWS::StackName}-data-a
  FoundationDataB:
    Type: AWS::EC2::Subnet
    Properties:
